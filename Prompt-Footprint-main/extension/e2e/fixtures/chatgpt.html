<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>ChatGPT (simulated)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:#212121; color:#ececec; height:100vh; display:flex; }
  html.light body { background:#fff; color:#0d0d0d; }
  #sidebar { width:260px; background:#171717; flex:none; padding:12px; transition:width .2s; overflow:hidden; }
  html.light #sidebar { background:#f9f9f9; }
  #sidebar.collapsed { width:0; padding:0; }
  #app { flex:1; display:flex; flex-direction:column; min-width:0; }
  #thread { flex:1; overflow:auto; padding:24px 16px 8px; }
  .msg { max-width:760px; margin:0 auto 20px; line-height:1.6; }
  #composer-wrap { padding:12px 16px 24px; }
  form[data-type="unified-composer"] { max-width:760px; margin:0 auto; }
  #composer-background { background:#303030; border:1px solid #4a4a4a; border-radius:26px; padding:12px 14px; }
  html.light #composer-background { background:#fff; border-color:#e3e3e3; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  #prompt-textarea { min-height:26px; max-height:200px; overflow:auto; outline:none; font-size:16px; line-height:1.5; }
  #prompt-textarea p { margin:0 0 .4em; }
  #prompt-textarea:empty::before { content: attr(data-placeholder); opacity:.5; }
  .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .row button { width:34px; height:34px; border-radius:50%; border:0; background:#4a4a4a; color:#fff; cursor:pointer; }
  html.light .row button { background:#f0f0f0; color:#111; }
  .spacer { flex:1 }
  button[data-testid="send-button"] { background:#fff; color:#000; }
  html.light button[data-testid="send-button"] { background:#000; color:#fff; }
  #attachments { display:none; gap:8px; margin-bottom:8px; }
  #attachments.on { display:flex; }
  .att { background:#4a4a4a; border-radius:10px; padding:8px 12px; font-size:13px; }
  #devbar { position:fixed; top:8px; right:8px; display:flex; gap:6px; z-index:9 }
  #devbar button { font-size:12px; padding:4px 8px; }
  #page-header { padding:10px 16px; font-size:13px; }
  #page-header button { background:transparent; border:0; color:inherit; font:inherit; cursor:pointer; }
  #page-header [role="menu"][data-state="closed"] { display:none; }
</style>
</head>
<body>
  <div id="devbar">
    <button onclick="document.documentElement.classList.toggle('dark');document.documentElement.classList.toggle('light')">theme</button>
    <button onclick="document.getElementById('sidebar').classList.toggle('collapsed')">sidebar</button>
    <button onclick="document.getElementById('attachments').classList.toggle('on')">attach</button>
    <button onclick="swapComposer()">new chat</button>
    <button onclick="switchModel()">switch model</button>
    <button onclick="toggleAuto()">auto</button>
    <button onclick="attachPdf()">attach pdf</button>
    <button onclick="detachPdf()">detach pdf</button>
  </div>
  <div id="sidebar"><div>Chats</div></div>
  <div id="app">
    <!-- The model switcher, in the shape ChatGPT exposes it: a button whose text
         is the current model, plus a menu that only exists while open. The extra
         hidden menu below is a decoy: a real page keeps the collapsed menu in the
         DOM, and a detector that reads it instead of the button is wrong. -->
    <div id="page-header">
      <button data-testid="model-switcher-dropdown-button" aria-haspopup="menu"
              aria-expanded="false" aria-label="Model selector">GPT-5.6 Sol</button>
      <div role="menu" data-state="closed">
        <div role="menuitemradio" aria-checked="false">GPT-5.6 Terra</div>
        <div role="menuitemradio" aria-checked="false">GPT-5.6 Luna</div>
      </div>
    </div>
    <div id="thread">
      <div class="msg" data-message-author-role="user" data-message-id="m1">What is a token?</div>
      <div class="msg" data-message-author-role="assistant" data-message-id="m2">A token is a chunk of text a model processes.</div>
    </div>
    <div id="composer-wrap">
      <form data-type="unified-composer">
        <div id="composer-background">
          <div id="attachments"><div class="att">q3-report.pdf</div></div>
          <div id="real-attachments"></div>
          <div id="prompt-textarea" contenteditable="true" data-lexical-editor="true"
               role="textbox" data-placeholder="Ask anything"></div>
          <div class="row">
            <button aria-label="Attach files">+</button>
            <button aria-label="Dictate">🎙</button>
            <span class="spacer"></span>
            <button data-testid="send-button" aria-label="Send prompt">↑</button>
          </div>
        </div>
      </form>
    </div>
  </div>
<script>
  // Change the model the way the product does: the button's text is the state.
  function switchModel() {
    const b = document.querySelector('[data-testid="model-switcher-dropdown-button"]');
    b.textContent = b.textContent.trim() === 'GPT-5.6 Sol' ? 'GPT-5.6 Luna' : 'GPT-5.6 Sol';
  }
  function toggleAuto() {
    const b = document.querySelector('[data-testid="model-switcher-dropdown-button"]');
    b.textContent = b.textContent.trim() === 'Auto' ? 'GPT-5.6 Sol' : 'Auto';
  }

  // ── Attachments ──────────────────────────────────────────────────────────
  // Attaching a file the way the product does it: a real `drop` carrying a real
  // File, followed by a chip in the composer. Both halves matter — the drop is
  // the only moment an extension is handed the bytes, and the chip is the only
  // evidence that the file is still attached.
  //
  // The PDF is built here rather than fetched so the fixture stays offline and
  // its contents are inspectable: six pages, a real /Count, and uncompressed
  // content streams carrying `Tj` text operators.
  function buildPdf(pageCount) {
    const line = 'The quarterly report covers operations across every region and '
      + 'highlights the principal risks identified by the audit committee.';
    const objects = new Map();
    const pageIds = [], contentIds = [];
    for (let i = 0; i < pageCount; i += 1) { pageIds.push(4 + 2 * i); contentIds.push(5 + 2 * i); }
    objects.set(1, '<< /Type /Catalog /Pages 2 0 R >>');
    objects.set(2, '<< /Type /Pages /Kids [' + pageIds.map((id) => id + ' 0 R').join(' ')
      + '] /Count ' + pageCount + ' >>');
    objects.set(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    for (let i = 0; i < pageCount; i += 1) {
      objects.set(pageIds[i], '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] '
        + '/Resources << /Font << /F1 3 0 R >> >> /Contents ' + contentIds[i] + ' 0 R >>');
      const body = 'BT /F1 12 Tf 72 720 Td 14 TL\n(Page ' + (i + 1) + ' heading) Tj T*\n('
        + line + ') Tj T*\n(' + line + ') Tj T*\nET\n';
      objects.set(contentIds[i], '<< /Length ' + body.length + ' >>\nstream\n' + body + '\nendstream');
    }
    let out = '%PDF-1.7\n';
    const offsets = new Map();
    const nums = [...objects.keys()].sort((a, b) => a - b);
    for (const n of nums) { offsets.set(n, out.length); out += n + ' 0 obj\n' + objects.get(n) + '\nendobj\n'; }
    const xref = out.length;
    const top = nums[nums.length - 1] + 1;
    out += 'xref\n0 ' + top + '\n0000000000 65535 f \n';
    for (let n = 1; n < top; n += 1) {
      out += offsets.has(n) ? String(offsets.get(n)).padStart(10, '0') + ' 00000 n \n'
        : '0000000000 65535 f \n';
    }
    out += 'trailer\n<< /Size ' + top + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n';
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i += 1) bytes[i] = out.charCodeAt(i) & 0xff;
    return bytes;
  }

  function attachPdf() {
    const file = new File([buildPdf(6)], 'q3-annual-report.pdf', { type: 'application/pdf' });
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById('prompt-textarea')
      .dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
    const chip = document.createElement('div');
    chip.className = 'att';
    chip.setAttribute('data-testid', 'composer-file-chip');
    chip.setAttribute('title', file.name);
    chip.textContent = file.name;
    document.getElementById('real-attachments').appendChild(chip);
  }

  function detachPdf() {
    document.getElementById('real-attachments').innerHTML = '';
  }

  // Mimic ChatGPT swapping the composer node when you open a new conversation.
  function swapComposer() {
    const bg = document.getElementById('composer-background');
    const old = document.getElementById('prompt-textarea');
    const next = old.cloneNode(false);
    next.innerHTML = '';
    old.replaceWith(next);
    history.pushState({}, '', '/c/' + Math.random().toString(36).slice(2, 8));
  }
</script>
</body>
</html>
